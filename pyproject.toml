[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchatlas"
version = "0.2.0"
description = "Trace-supported evidence-dependency graphs for search trajectories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tqdm>=4.64"]

[project.optional-dependencies]
builder = ["openai>=1.0"]

[project.scripts]
searchatlas-build = "searchatlas.builder.__main__:main"
searchatlas-evaluate = "searchatlas.evaluation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
